<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Landing — MF CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/mobile.css">
  <style>
    /* ── LOGIN SCREEN ── */
    #ll-login-screen {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; background:#0f172a;
    }
    .ll-login-box {
      background:#1e293b; border:1px solid rgba(255,255,255,0.08);
      border-radius:20px; padding:40px 36px; width:100%; max-width:360px;
      text-align:center;
    }
    .ll-login-box h2 { font-size:20px; font-weight:800; margin:0 0 6px; }
    .ll-login-box p  { font-size:13px; color:#64748b; margin:0 0 28px; }
    .ll-login-box input {
      width:100%; padding:12px 16px; border-radius:10px; margin-bottom:12px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
      color:#f1f5f9; font-size:14px; font-family:inherit; box-sizing:border-box;
    }
    .ll-login-box input:focus { outline:none; border-color:rgba(59,130,246,0.5); }
    .ll-login-submit {
      width:100%; padding:13px; border-radius:10px; border:none;
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:#fff; font-size:15px; font-weight:700; cursor:pointer;
      font-family:inherit; transition:0.2s;
    }
    .ll-login-submit:hover { opacity:0.9; }
    #ll-login-erro { color:#f87171; font-size:13px; margin-top:10px; min-height:18px; }

    /* ── MAIN SCREEN ── */
    #ll-main-screen { display:none; }
    .ll-page { padding:24px; }
    .ll-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:24px; flex-wrap:wrap; gap:12px;
    }
    .ll-title { font-size:22px; font-weight:800; display:flex; align-items:center; gap:10px; }
    .ll-header-right { display:flex; align-items:center; gap:12px; }
    #ll-user-email { font-size:12px; color:#475569; }
    #ll-logout-btn {
      background:none; border:1px solid rgba(255,255,255,0.1); border-radius:8px;
      color:#64748b; font-size:12px; padding:6px 12px; cursor:pointer;
      font-family:inherit; transition:0.2s;
    }
    #ll-logout-btn:hover { color:#f87171; border-color:rgba(248,113,113,0.3); }

    /* ── TABS ── */
    .ll-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .ll-tab {
      padding:8px 18px; border-radius:8px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.04); color:#94a3b8;
      font-size:13px; font-weight:600; cursor:pointer; transition:0.2s;
    }
    .ll-tab.active { background:rgba(59,130,246,0.15); border-color:rgba(59,130,246,0.4); color:#93c5fd; }
    .ll-count {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:22px; height:22px; border-radius:999px; padding:0 6px;
      background:rgba(59,130,246,0.2); color:#93c5fd; font-size:11px; font-weight:700; margin-left:6px;
    }

    /* ── GRID ── */
    .ll-col { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .ll-empty { color:#475569; text-align:center; padding:40px 0; grid-column:1/-1; font-size:14px; }

    /* ── CARD ── */
    .ll-card {
      background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
      border-radius:16px; padding:18px; transition:0.25s;
    }
    .ll-card:hover { border-color:rgba(59,130,246,0.3); transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,0.3); }
    .ll-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .ll-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
    .ll-card-data { font-size:11px; color:#475569; }
    .ll-card-nome { font-size:16px; font-weight:700; margin-bottom:8px; color:#f1f5f9; }
    .ll-card-row  { font-size:13px; color:#94a3b8; margin-bottom:4px; }
    .ll-card-row.muted { font-size:11px; color:#475569; margin-top:4px; }
    .ll-card-actions { display:flex; gap:8px; margin-top:14px; }
    .ll-btn {
      flex:1; padding:9px 0; border-radius:8px; font-size:12px; font-weight:700;
      cursor:pointer; border:none; text-align:center; text-decoration:none;
      transition:0.2s; display:inline-flex; align-items:center; justify-content:center;
    }
    .ll-btn-wpp    { background:rgba(37,211,102,0.15); border:1px solid rgba(37,211,102,0.3); color:#4ade80; }
    .ll-btn-wpp:hover { background:rgba(37,211,102,0.25); }
    .ll-btn-detail { background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3); color:#a5b4fc; }
    .ll-btn-detail:hover { background:rgba(99,102,241,0.25); }
    .ll-status-row { margin-top:10px; }
    .ll-select {
      width:100%; background:#1e293b; color:#e2e8f0;
      border:1px solid rgba(255,255,255,0.1); border-radius:8px;
      padding:7px 10px; font-size:13px; font-family:inherit; cursor:pointer;
    }

    /* ── LOADING ── */
    #ll-loading { text-align:center; padding:48px; color:#475569; font-size:14px; grid-column:1/-1; }

    /* ── MODAL ── */
    #ll-modal {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
      z-index:1000; align-items:center; justify-content:center; padding:16px;
    }
    .ll-modal-box {
      background:#1e293b; border:1px solid rgba(255,255,255,0.1); border-radius:20px;
      padding:28px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; position:relative;
    }
    .ll-modal-title { font-size:18px; font-weight:700; margin:0 0 20px; }
    .ll-modal-close {
      position:absolute; top:16px; right:18px; background:none; border:none;
      color:#64748b; font-size:20px; cursor:pointer; line-height:1; padding:4px;
    }
    .ll-modal-close:hover { color:#e2e8f0; }
    .ll-modal-table { width:100%; border-collapse:collapse; }
    .ll-modal-table td { padding:9px 8px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.05); vertical-align:top; }
    .ll-modal-table td:first-child { color:#64748b; font-weight:600; width:38%; white-space:nowrap; }
    .ll-modal-table td:last-child { color:#e2e8f0; word-break:break-word; }

    /* ── NOTA PRÉVIA ── */
    .ll-auth-note {
      background:rgba(234,179,8,0.08); border:1px solid rgba(234,179,8,0.2);
      border-radius:10px; padding:12px 16px; font-size:12px; color:#fbbf24;
      margin-bottom:20px; text-align:left; line-height:1.6;
    }
  </style>
</head>
<body>

  <!-- ── LOGIN SCREEN ── -->
  <div id="ll-login-screen">
    <div class="ll-login-box">
      <h2>🌐 Leads Landing</h2>
      <p>Acesso restrito — MF Soluções CRM</p>
      <div class="ll-auth-note">
        ⚠️ Use as credenciais do projeto <strong>mf-solucoes-crm</strong>.<br>
        Cadastre o usuário em: Firebase Console → Authentication.
      </div>
      <form id="ll-login-form" autocomplete="on">
        <input id="ll-email" type="email"    placeholder="E-mail"  required autocomplete="email">
        <input id="ll-senha" type="password" placeholder="Senha"   required autocomplete="current-password">
        <button type="submit" class="ll-login-submit">Entrar</button>
      </form>
      <div id="ll-login-erro"></div>
    </div>
  </div>

  <!-- ── MAIN SCREEN ── -->
  <div id="ll-main-screen">

    <button type="button" id="btnSidebarToggle" class="sidebar-toggle" aria-label="Abrir menu">☰</button>
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <aside id="sidebar" role="navigation" aria-label="Menu principal">
      <div class="menu-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">MF CRM</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn" onclick="window.location='index.html'">
          <span class="btn-icon">📊</span> Dashboard
        </button>
        <button class="sidebar-btn" onclick="window.location='index.html'">
          <span class="btn-icon">📋</span> Leads
        </button>
        <button class="sidebar-btn active" aria-current="page">
          <span class="btn-icon">🌐</span> Leads Landing
        </button>
        <button class="sidebar-btn" onclick="window.location='index.html'">
          <span class="btn-icon">🔧</span> Instalações
        </button>
      </nav>
      <div class="sidebar-footer">
        <div style="font-size:12px;color:#475569;padding:8px 12px;" id="ll-user-email">—</div>
      </div>
    </aside>

    <main class="main-content">
      <section class="ll-page">

        <div class="ll-header">
          <div class="ll-title">🌐 Leads Landing</div>
          <div class="ll-header-right">
            <button id="ll-logout-btn">Sair</button>
          </div>
        </div>

        <div class="ll-tabs">
          <button class="ll-tab active" data-col="col-novos">
            Novos <span class="ll-count" id="counter-novos">0</span>
          </button>
          <button class="ll-tab" data-col="col-todos">
            Todos <span class="ll-count" id="counter-todos">0</span>
          </button>
        </div>

        <div class="ll-col" id="col-novos">
          <div id="ll-loading">Carregando leads...</div>
        </div>
        <div class="ll-col" id="col-todos" style="display:none;"></div>

      </section>
    </main>

  </div><!-- #ll-main-screen -->

  <!-- ── MODAL DETALHES ── -->
  <div id="ll-modal" role="dialog" aria-modal="true">
    <div class="ll-modal-box">
      <button class="ll-modal-close" id="ll-modal-close-btn" aria-label="Fechar">✕</button>
      <div class="ll-modal-title">Detalhes do Lead</div>
      <table class="ll-modal-table"><tbody id="ll-modal-body"></tbody></table>
    </div>
  </div>

  <!-- Sidebar toggle -->
  <script>
    const tog = document.getElementById('btnSidebarToggle');
    const bkd = document.getElementById('sidebarBackdrop');
    const sb  = document.getElementById('sidebar');
    if(tog) tog.addEventListener('click', () => sb && sb.classList.toggle('open'));
    if(bkd) bkd.addEventListener('click', () => sb && sb.classList.remove('open'));
  </script>

  <script type="module" src="./js/leads-landing.js"></script>
</body>
</html>
