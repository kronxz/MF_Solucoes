<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fundo -->
  <rect width="256" height="256" rx="32" fill="#0f172a"/>

  <!-- Painel solar — grades -->
  <rect x="36" y="60" width="184" height="110" rx="8" fill="#1e3a5f" stroke="#2563eb" stroke-width="2"/>
  <!-- Linhas verticais do painel -->
  <line x1="97"  y1="60" x2="97"  y2="170" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
  <line x1="159" y1="60" x2="159" y2="170" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
  <!-- Linhas horizontais do painel -->
  <line x1="36"  y1="97"  x2="220" y2="97"  stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>
  <line x1="36"  y1="133" x2="220" y2="133" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>

  <!-- Raio solar / bolt — destaque -->
  <polygon points="138,72 118,130 134,130 118,184 158,116 140,116 158,72" fill="#f59e0b" opacity="0.95"/>

  <!-- Texto "MF" embaixo -->
  <text x="128" y="218" font-family="Arial,sans-serif" font-size="28" font-weight="700"
        fill="#e2e8f0" text-anchor="middle" letter-spacing="4">MF</text>
  <text x="128" y="238" font-family="Arial,sans-serif" font-size="11" font-weight="400"
        fill="#64748b" text-anchor="middle" letter-spacing="2">SOLUÇÕES</text>
</svg>
